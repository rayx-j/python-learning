<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
        <style>
        /* 这里是 CSS 代码 */
        body {
            background-color: #f0f8ff; /* 背景色：淡淡的爱丽丝蓝 */
            font-family: "Microsoft YaHei", sans-serif; /* 字体：微软雅黑 */
            text-align: center; /* 所有文字居中 */
            padding: 50px; /* 距离页面顶部留出距离 */
        }
        h1 {
            color: #2e8b57; /* 标题颜色：海洋绿 */
            font-size: 40px; /* 字体放大 */
            margin-bottom: 10px;
        }

        p {
            color: #555; /* 段落颜色：深灰色 */
            font-size: 18px;
        }
        h2 {
            color: #3cb371;
            margin-top: 40px;
        }
        ul {
            list-style-type: none; /* 去掉列表前面的小黑点 */
            padding: 0;
        }
        li {
            background-color: white; /* 列表项背景变白 */
            margin: 10px auto; /* 列表项间距 */
            padding: 10px;
            width: 300px; /* 固定宽度 */
            border-radius: 8px; /* 圆角 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* 加上淡淡的阴影 */
            color: #333;
        }
        button {
            background-color: #2e8b57; /* 按钮背景色 */
            color: white; /* 按钮文字白色 */
            padding: 12px 24px; /* 按钮大小 */
            border: none; /* 去掉默认边框 */
            border-radius: 25px; /* 按钮变圆角 */
            font-size: 16px;
            cursor: pointer; /* 鼠标移上去变成小手 */
            margin-top: 30px;
        }
        button:hover {
            background-color: #236b43; /* 鼠标悬停时按钮颜色变深 */
        }
    </style>
</head>
<body>
    <h1>你好，我是 rayx！</h1>
    <p>欢迎来到我的第一个网页。我是一名园林专业的学生，正在学习编程。</p>
    <h2>我的目标</h2>
    <ul>
        <li>学会写代码</li>
        <li>做出好看的网站和 App</li>
        <li>用 AI 和算法解决园林生态问题</li>
    </ul>
    <input type="text" id="plantInput" placeholder="输入植物名字...">
    <button onclick="addPlant()">添加植物</button>
    <ul id="plantList">
        <!-- 这里以后会自动长出列表项 -->
    </ul>
         <script>
        function addPlant() {
            // 1. 找到输入框
            let input = document.getElementById("plantInput");
            // 2. 获取用户输入的文字
            let plantName = input.value; 
             // 如果输入为空，就不添加
            if (plantName === "") {
                alert("请输入植物名字！");
                return;
            }
            // 3. 找到列表容器
            let ul = document.getElementById("plantList");
            // 4. 创建一个新的列表项 <li>
            let li = document.createElement("li");
            // 5. 把文字塞进列表项里
            li.innerText = plantName;
            // 6. 把做好的列表项加到 ul 里面
            ul.appendChild(li);
                        // 弄一个删除按钮
            let delBtn = document.createElement("button");
            delBtn.innerText = "删除";
                        // 给删除按钮单独加点样式
            delBtn.style.marginLeft = "15px"; // 往左边挤一挤
            delBtn.style.padding = "5px 10px"; // 按钮变小巧一点
            delBtn.style.backgroundColor = "#e74c3c"; // 变成警示红色
            delBtn.style.fontSize = "14px"; // 字小一点
            // 当点击这个删除按钮时，把当前的 li 删掉
            delBtn.onclick = function() {
                ul.removeChild(li);
            };           
            // 把删除按钮也塞进卡片里
            li.appendChild(delBtn);
            // 7. 清空输入框，方便下一次输入
            input.value = "";
        }
    </script>
</body>
</html>
