<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
        <style>
        /* 这里是 CSS 代码 */
        body {
            background-color: #f0f8ff; /* 背景色：淡淡的爱丽丝蓝 */
            font-family: "Microsoft YaHei", sans-serif; /* 字体：微软雅黑 */
            text-align: center; /* 所有文字居中 */
            padding: 50px; /* 距离页面顶部留出距离 */
        }
        h1 {
            color: #2e8b57; /* 标题颜色：海洋绿 */
            font-size: 40px; /* 字体放大 */
            margin-bottom: 10px;
        }

        p {
            color: #555; /* 段落颜色：深灰色 */
            font-size: 18px;
        }
        h2 {
            color: #3cb371;
            margin-top: 40px;
        }
        ul {
            list-style-type: none; /* 去掉列表前面的小黑点 */
            padding: 0;
        }
        li {
            background-color: white; /* 列表项背景变白 */
            margin: 10px auto; /* 列表项间距 */
            padding: 10px;
                       width: fit-content;
            min-width: 200px; /* 保证最短也不会太窄 */
            padding: 10px 20px; /* 左右留点空隙 */
            border-radius: 8px; /* 圆角 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* 加上淡淡的阴影 */
            color: #333;
        }
        button {
            background-color: #2e8b57; /* 按钮背景色 */
            color: white; /* 按钮文字白色 */
            padding: 12px 24px; /* 按钮大小 */
            border: none; /* 去掉默认边框 */
            border-radius: 25px; /* 按钮变圆角 */
            font-size: 16px;
            cursor: pointer; /* 鼠标移上去变成小手 */
            margin-top: 30px;
        }
        button:hover {
            background-color: #236b43; /* 鼠标悬停时按钮颜色变深 */
        }
    </style>
</head>
<body>
    <h1>你好，我是 rayx！</h1>
    <p>欢迎来到我的第一个网页。我是一名园林专业的学生，正在学习编程。</p>
    <h2>我的目标</h2>
    <ul>
        <li>学会写代码</li>
        <li>做出好看的网站和 App</li>
        <li>用 AI 和算法解决园林生态问题</li>
    </ul>
        <div style="margin-top: 30px;">
        <input type="text" id="plantInput" placeholder="输入植物名字...">
        <!-- 👇 新加的输入框 👇 -->
        <input type="number" id="moistureInput" placeholder="最低湿度%" style="width: 80px;">
        <button onclick="addPlant()">添加植物</button>
    </div>
    <ul id="plantList">
        <!-- 这里以后会自动长出列表项 -->
    </ul>
         <script>
                     function addPlant() {
            let name = document.getElementById("plantInput").value;
            let moisture = document.getElementById("moistureInput").value;
            
            if (name === "" || moisture === "") {
                alert("请把名字和湿度填完整！");
                return;
            }

            fetch('http://127.0.0.1:5000/add_plant', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, min_moisture: parseInt(moisture) })
            })
            .then(res => res.json())
            .then(data => {
                // 添加成功后，直接刷新整个网页
                window.location.reload(); 
            })
            .catch(error => console.error("出错了：", error));
        }
                // 网页加载完毕后，自动去服务器拿数据
                window.onload = function() {
            fetch('http://127.0.0.1:5000/get_plants')
            .then(res => res.json())
            .then(data => {
                let ul = document.getElementById("plantList");
                ul.innerHTML = ""; // 每次加载先清空网页，防止重复显示
                
                data.forEach(plant => {
                                     let li = document.createElement("li");
                    // 1. 单独创建一个 span 标签装文字，方便以后只改文字，不影响按钮
                    let textSpan = document.createElement("span");
                    textSpan.innerText = `${plant.name} (最低湿度:${plant.min_moisture}%)`;
                    li.appendChild(textSpan); // 把文字放进卡片里
                    
                    // 删除按钮的样式（按昨天的极简版）
                                        // 👇 新增：模拟传感器按钮 👇
                    let sensorBtn = document.createElement("button");
                    sensorBtn.innerText = "模拟检测";
                    sensorBtn.style.marginLeft = "15px";
                    sensorBtn.style.padding = "5px 10px";
                    sensorBtn.style.marginTop = "0px";
                    sensorBtn.style.backgroundColor = "#3498db"; // 蓝色
                    sensorBtn.style.color = "white";
                    sensorBtn.style.fontSize = "14px";
                    
                    // 点击按钮，弹出输入框模拟真实湿度
                    sensorBtn.onclick = function() {
                        let currentMoisture = prompt(`请输入【${plant.name}】当前的实际土壤湿度（0-100）：`);
                        
                        // 如果用户点了取消或者没填，就不往下执行
                        if(currentMoisture === null || currentMoisture === "") return; 
                        
                        // 把当前湿度发给后端判断
                        fetch('http://127.0.0.1:5000/check_moisture', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                name: plant.name, 
                                current_moisture: parseInt(currentMoisture) 
                            })
                        })
                        .then(res => res.json())
                                               .then(data => {
                            if (data.status === "warning") {
                                // 缺水警报：卡片变红
                                li.style.backgroundColor = "#ffe5e5";
                                li.style.border = "2px solid #e74c3c";
                                textSpan.innerText = `🚨 ${plant.name} 缺水啦! (需:${plant.min_moisture}%)`;
                                textSpan.style.color = "#c0392b";
                            } 
                            else if (data.status === "ok") {
                                // 正常状态：恢复白底
                                li.style.backgroundColor = "white";
                                li.style.border = "none";
                                textSpan.innerText = `✅ ${plant.name} 水分充足 (需:${plant.min_moisture}%)`;
                                textSpan.style.color = "#333";
                            }
                        });
                    };
                    
                    // 把传感器按钮塞进卡片里
                    li.appendChild(sensorBtn); 
                    // 👆 新增结束 👆
                    // 下面是你原本的删除按钮代码...
                    let delBtn = document.createElement("button");
                    delBtn.innerText = "删除";
                    delBtn.style.marginLeft = "15px";
                    delBtn.style.padding = "5px 10px";
                    delBtn.style.marginTop = "0px"; 
                    delBtn.style.backgroundColor = "#e74c3c";
                    delBtn.style.fontSize = "14px";
                                       delBtn.onclick = function() {
                        // 通知后端从数据库中删除
                        fetch('http://127.0.0.1:5000/delete_plant', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: plant.name })
                        })
                        .then(res => res.json())
                        .then(data => {
                            // 后端删成功后，前端才移除卡片
                            if (data.status === "success") {
                                ul.removeChild(li);
                            }
                        });
                    };
                    
                    li.appendChild(delBtn);
                    ul.appendChild(li);
                });
            });
        };
    </script>
</body>
</html>
